  plan: [play_bow|zoomies, run_with_toy|zoomies, play_bow]
  style: trot
  face: pant_smile
  bubble: rope
  urg: 7
  kind: play
- id: tease_bow_plush
  habit: H3
  when: happy >= 7 and plush in (near, mouth) and owner == here
  score: 8.5 + 0.3 * (happy - 7)
  plan: [play_bow|zoomies, run_with_toy|zoomies, play_bow]
  style: trot
  face: pant_smile
  bubble: plush
  urg: 7
  kind: play
- id: zoomies
  habit: H12
