  score: 5 + 0.3 * bored
  plan: [pickup_rope, run_with_toy|toss_toy|chew_toy, play_bow|act_none]
  style: trot
  face: pant_smile
  bubble: rope
  urg: 6
  kind: play
- id: fetch_plush
  habit: H12
  when: plush in (near, far) and bored >= 5 and energy >= 4
