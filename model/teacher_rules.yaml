# Pixel Lili's teacher (spec 10.7, level A): the rule brain. Every template is one way Lili may answer a situation,
# tied to a habit of spec 3.2 (H1-H15). The brain scores every template whose condition holds and whose first action
# can run now, and picks one by softmax (tau 0.6): a score 3 higher is ~150 times likelier. tools/gen_rules.py
# compiles this file into common/lili/brain_rules_gen.c (the simulator, the time away and the panel run the same).
#
# Conditions and scores are Python-syntax expressions over the brain's input fields (model/schema_lili.json):
#   loc spot tod season day guilty pad mess bowls owner view sig rope plush sun last since   (their token names
#   without the field prefix: owner == back_long, rope in (near, mouth), mess > 0)
#   hunger energy happy bored lonely bladder                                                  (buckets 0..9)
# min max log exp work. A plan has up to three slots; a|b|c = one of those (the possible ones, at random).
# kind = the activity it is (play rest eat explore greet mischief social): spec 10.11 P11 punishes doing the same
# kind again and again when she is bored (the engine subtracts from a template of the last kind after a long while).
#
# The tiers: guilt 25 > bladder 20 > the greeting 17-19 (H1: the owner home comes first, even before food or
# sleep) > a need (16) > September 12th 15 > night sleep 14 > situations 7-10 > pastimes 3-6.

# ---- H10: guilty, she hides under the bench and only peeks out (R1 lets her out) ----
- id: guilty_hide
  habit: H10
  when: guilty == 1
  score: 25
  plan: [hide_bench, peek_bench]
  style: scurry
  face: guilty
  bubble: sweat
  urg: 9
  kind: mischief
- id: guilty_peek
  habit: H10
  when: guilty == 1 and spot == nook
  score: 25
  plan: [peek_bench, hide_bench]
  style: tiptoe
  face: guilty
  bubble: none
  urg: 3
  kind: mischief

# ---- H8 / H9: the bladder over 8 must go; the floor with spec 9.2's chance, the pad otherwise ----
- id: pee_pad
  habit: H8
  when: bladder >= 8
  score: 20 + 0.6 * log(1 - min(0.85, 0.05 + 0.08 * max(0, bored - 5) + 0.08 * max(0, lonely - 5) + 0.5 * (pad == full)) * (day != memorial))
  plan: [use_pad]
  style: trot
  face: neutral
  bubble: none
  urg: 8
  kind: rest
- id: pee_floor
  habit: H9
  when: bladder >= 8 and day != memorial
  score: 20 + 0.6 * log(max(0.001, min(0.85, 0.05 + 0.08 * max(0, bored - 5) + 0.08 * max(0, lonely - 5) + 0.5 * (pad == full))))
  plan: [mischief_floor, hide_bench]
  style: tiptoe
  face: guilty
  bubble: none
  urg: 7
  kind: mischief

# ---- H14: hungry, she eats from the bowls by the bench ----
- id: eat
  habit: H14
  when: hunger >= 7 and bowls != empty
  score: 16
  plan: [eat, drink|act_none, pant_idle|act_none]
  style: trot
  face: pant_smile
  bubble: food
  urg: 8
  kind: eat
- id: eat_peckish
  habit: H14
  when: hunger >= 5 and bowls != empty
  score: 1.5 + hunger
  plan: [eat, drink|act_none]
  style: walk
  face: neutral
  bubble: food
  urg: 5
  kind: eat
- id: hungry_empty
  habit: H5
  when: hunger >= 6 and bowls == empty
  score: 11
  plan: [go_bowls, huff, beg]
  style: trot
  face: pout
  bubble: food
  urg: 7
  kind: social

# ---- H11: night in the nook; worn out at any hour ----
- id: sleep_night
  habit: H11
  when: tod == night and energy <= 6
  score: 14 + (6 - energy)
  plan: [sleep_nook]
  style: sleepy
  face: sleepy
  bubble: zzz
  urg: 2
  kind: rest
- id: night_settle
  habit: H11
  when: tod == night
  score: 9
  plan: [go_nook, lie_down, sleep_nook]
  style: sleepy
  face: sleepy
  bubble: zzz
  urg: 2
  kind: rest
- id: exhausted
  habit: H11
  when: energy <= 1
  score: 15
  plan: [sleep_nook|sleep_rug]
  style: sleepy
  face: sleepy
  bubble: zzz
  urg: 3
  kind: rest
- id: sleepy_day
  habit: H11
  when: energy <= 3 and tod != night
  score: 9
  plan: [lie_down|sleep_rug|nap_sunbeam, act_none]
  style: sleepy
  face: sleepy
  bubble: zzz
  urg: 2
  kind: rest

# ---- H15: September 12th, she stays close ----
- id: memorial_close
  habit: H15
  when: day == memorial
  score: 15
  plan: [goto_front|ask_pet, follow_finger|ask_pet, pant_idle]
  style: walk
  face: relaxed
  bubble: heart
  urg: 4
  kind: social

# ---- H1: the owner is back: she brings a toy and chews it in front of them ----
- id: greet_toy
  habit: H1
  when: owner in (back_short, back_long) and guilty == 0
  score: 16.5 + 0.2 * happy + (owner == back_long)
  plan: [pickup_rope|pickup_plush|bring_toy, bring_toy, chew_toy]
  style: trot
  face: pant_smile
  bubble: heart
  urg: 9
  kind: greet
- id: greet_come
  habit: H1
  when: owner in (back_short, back_long) and guilty == 0
  score: 9 + 0.2 * happy
  plan: [goto_front, wag, ask_pet]
  style: trot
  face: pant_smile
  bubble: heart
  urg: 8
  kind: greet

# ---- H6: the afternoon sun on the room's floor ----
- id: sunbeam
  habit: H6
  when: tod == afternoon and sun == on and energy >= 3 and energy <= 8
  score: 8.5
  plan: [go_sunbeam|nap_sunbeam, pant_idle|act_none]
  style: curious
  face: relaxed
  bubble: none
  urg: 3
  kind: rest

